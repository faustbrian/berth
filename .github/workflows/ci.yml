name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: no job publishes anything.
permissions:
  contents: read

# Every action is pinned to a full commit (scripts/audit-workflow-actions.sh).
jobs:
  policy:
    name: Policy Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Prove the policy audits can fail, then run them
        run: ./scripts/test-policy-audits.sh

      # Full history with tags: the check walks 7.0.0..8.0.0.
      - name: Check ledger coverage of 8.x
        run: ./scripts/check-v9-ledger.sh

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy

      # The lint levels live in Cargo.toml; the policy audit keeps them on.
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  supply-chain:
    name: Dependency Security and Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2

      - name: Audit advisories, licenses, duplicates and sources
        run: ./scripts/audit-supply-chain.sh

  test:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Build release binary
        run: cargo build --release --locked --all-features

      # One test thread: many tests write a fake `docker`/`curl` and run it.
      # On Linux, a fork by another test thread while such a file is open
      # for writing makes its exec fail with ETXTBSY ("Text file busy").
      - name: Run tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

  agent-acceptance:
    name: Agent Acceptance (linux-x86_64, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, docker-rootless, podman-rootless]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Build release binary
        run: cargo build --release --locked

      # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor;
      # rootless engines need them.
      - name: Allow unprivileged user namespaces
        if: matrix.engine != 'docker'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner's rootful daemon stops; the runner user gets its own
      # daemon, which the acceptance reaches through DOCKER_HOST. The image
      # installs docker-ce from Docker's repository and then removes it, so
      # the repository comes back (its key pinned by checksum, fingerprint
      # 9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88) for the rootless
      # extras of exactly the installed docker-ce version.
      - name: Start rootless Docker
        if: matrix.engine == 'docker-rootless'
        run: |
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o docker.asc
          echo "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570  docker.asc" | sha256sum -c -
          sudo install -m 0644 docker.asc /etc/apt/keyrings/docker.asc
          rm docker.asc
          echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
            | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          version="$(dpkg-query -W -f='${Version}' docker-ce)"
          sudo apt-get install -y uidmap "docker-ce-rootless-extras=$version"
          sudo systemctl disable --now docker.service docker.socket
          sudo rm -f /var/run/docker.sock
          dockerd-rootless-setuptool.sh install
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock" >> "$GITHUB_ENV"

      # The runner image ships MySQL with AppArmor's path-attached
      # `usr.sbin.mysqld` profile. Rootless engines cannot apply their own
      # profile, so the host's would confine every container's mysqld: it
      # could not read the image's /etc/my.cnf, and the engine could not
      # kill it. Unloaded here, as docs/v9/agents.md tells such hosts to.
      - name: Keep the host's MySQL AppArmor profile off containers
        if: matrix.engine != 'docker'
        run: |
          sudo aa-status | grep -i mysqld || echo "no mysqld profile loaded"
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
          fi

      # Ubuntu 24.04's Podman ships aardvark-dns 1.4.0, which drops DNS
      # replies under concurrent containers (containers/aardvark-dns#389):
      # parallel agents saw `Temporary failure in name resolution`. The job
      # tests berth, not that bug, so it uses a fixed release (pinned by
      # checksum); docs/v9/agents.md tells such hosts the same.
      - name: Install a fixed aardvark-dns
        if: matrix.engine == 'podman-rootless'
        run: |
          curl -fsSL -o aardvark-dns.gz https://github.com/containers/aardvark-dns/releases/download/v1.17.1/aardvark-dns.gz
          echo "4bfbc01eabd2f64a8228cf00b178885d927f68f7e24fdecc905dde39af8de7f6  aardvark-dns.gz" | sha256sum -c -
          gunzip aardvark-dns.gz
          sudo install -m 0755 aardvark-dns /usr/lib/podman/aardvark-dns
          rm aardvark-dns
          /usr/lib/podman/aardvark-dns --version

      - name: Show the rootless engines
        if: matrix.engine != 'docker'
        run: |
          if [ "${{ matrix.engine }}" = podman-rootless ]; then
            podman info --format '{{.Version.Version}} rootless={{.Host.Security.Rootless}}'
          else
            docker info --format '{{.ServerVersion}} {{json .SecurityOptions}}'
          fi

      # A hosted runner is far smaller than a workstation: four parallel
      # agents exercise every step; the 30-agent run is recorded in
      # docs/v9/benchmarks.md.
      - name: Run parallel agents
        env:
          BERTH_ENGINE: ${{ matrix.engine == 'podman-rootless' && 'podman' || 'docker' }}
        run: ./scripts/accept-v9-agents.sh target/release/berth target/agent-acceptance 4

      - name: Publish the acceptance record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-acceptance-linux-x86_64-${{ matrix.engine }}
          path: target/agent-acceptance
          if-no-files-found: error
          retention-days: 30
