[package]
name = "berth"
version = "10.1.2"
edition = "2024"
description = "Disposable, isolated Docker environments for every checkout, built for AI agents"
license = "MIT"
repository = "https://github.com/faustbrian/berth"
readme = "README.md"
keywords = ["laravel", "docker", "workspace", "orchestrator", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
indicatif = "0.18"
colored = "3"
clap_complete = "4"
rayon = "1"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
time = { version = "0.3", features = ["formatting", "local-offset"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
sha2 = "0.11"
getrandom = "0.3"
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }

[lints.rust]
# Absolute safety - forbid unsafe code entirely
unsafe_code = "forbid"

# Documentation and code quality
missing_docs = "warn"

# Rust edition compatibility
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# Prevent common mistakes
let_underscore_drop = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
# Keep the enforced baseline intentionally smaller than the set of every
# opt-in Clippy opinion. A lint gate that the crate disables globally provides
# no protection. Every rule below is enforced in normal production code.
all = { level = "deny", priority = -1 }

# Safety-critical lints: production paths return typed errors instead of
# panicking or terminating the process behind their caller.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unwrap_in_result = "deny"
exit = "deny"
mem_forget = "deny"

# Debugging output must not reach a release build.
dbg_macro = "deny"

# High-signal correctness footguns not included in `clippy::all`.
large_include_file = "deny"
infinite_loop = "deny"
lossy_float_literal = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
